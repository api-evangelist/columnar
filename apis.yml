name: Columnar
description: 'Columnar is a data-infrastructure company advancing open standards for
  database connectivity. It builds and maintains tooling around ADBC (Apache Arrow
  Database Connectivity), including dbc — a cross-platform command-line package manager
  that installs and manages ADBC drivers across macOS, Linux, and Windows and eight
  programming languages — and databow, a command-line SQL query tool over ADBC. Columnar
  also ships the DuckDB ADBC community extension and publishes Agent Skills so AI agents
  can connect to and query databases through ADBC. The company was surfaced as a portfolio
  company of Bessemer Venture Partners and is built on the Apache Arrow open-source
  ecosystem.'
